<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" font-family="Helvetica, Arial, sans-serif">
  <rect width="980" height="620" fill="#ffffff"/>

  <text x="490" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#16222e">Figura 1 · Mapa funcional de CloudForge</text>
  <text x="490" y="54" text-anchor="middle" font-size="12" fill="#5b6b78">Quince módulos agrupados en cuatro bloques funcionales</text>

  <!-- BLOQUE ACCESO -->
  <rect x="30" y="80" width="200" height="200" rx="8" fill="#eef4f9" stroke="#1f5f8b" stroke-width="2"/>
  <text x="130" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5f8b">ACCESO</text>
  <rect x="50" y="118" width="160" height="42" rx="4" fill="#ffffff" stroke="#9ec7e2"/>
  <text x="130" y="138" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#16222e">M01 USUARIOS</text>
  <text x="130" y="152" text-anchor="middle" font-size="9.5" fill="#5b6b78">perfiles y autorización</text>
  <rect x="50" y="172" width="160" height="42" rx="4" fill="#ffffff" stroke="#9ec7e2"/>
  <text x="130" y="192" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#16222e">M14 AUDITORÍA</text>
  <text x="130" y="206" text-anchor="middle" font-size="9.5" fill="#5b6b78">registro inmutable</text>
  <text x="130" y="244" text-anchor="middle" font-size="9.5" fill="#5b6b78" font-style="italic">Atraviesa todos</text>
  <text x="130" y="258" text-anchor="middle" font-size="9.5" fill="#5b6b78" font-style="italic">los demás bloques</text>

  <!-- BLOQUE CATALOGO -->
  <rect x="265" y="80" width="200" height="200" rx="8" fill="#eef4f9" stroke="#1f5f8b" stroke-width="2"/>
  <text x="365" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5f8b">CATÁLOGO</text>
  <rect x="285" y="118" width="160" height="42" rx="4" fill="#ffffff" stroke="#9ec7e2"/>
  <text x="365" y="138" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#16222e">M02 PRODUCTOS</text>
  <text x="365" y="152" text-anchor="middle" font-size="9.5" fill="#5b6b78">tipos y atributos</text>
  <rect x="285" y="172" width="160" height="42" rx="4" fill="#ffffff" stroke="#9ec7e2"/>
  <text x="365" y="192" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#16222e">M03 PROVEEDORES</text>
  <text x="365" y="206" text-anchor="middle" font-size="9.5" fill="#5b6b78">regiones y precios</text>
  <rect x="285" y="226" width="160" height="38" rx="4" fill="#f7fafc" stroke="#c9d8e3" stroke-dasharray="3 2"/>
  <text x="365" y="249" text-anchor="middle" font-size="10" fill="#5b6b78">precio = producto + región</text>

  <!-- BLOQUE DISEÑO -->
  <rect x="500" y="80" width="200" height="200" rx="8" fill="#eef4f9" stroke="#1f5f8b" stroke-width="2"/>
  <text x="600" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5f8b">DISEÑO</text>
  <rect x="518" y="114" width="164" height="36" rx="4" fill="#ffffff" stroke="#9ec7e2"/>
  <text x="600" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#16222e">M04 PROYECTOS</text>
  <text x="600" y="143" text-anchor="middle" font-size="9" fill="#5b6b78">la necesidad del cliente</text>
  <rect x="518" y="156" width="164" height="36" rx="4" fill="#ffffff" stroke="#9ec7e2"/>
  <text x="600" y="173" text-anchor="middle" font-size="11" font-weight="bold" fill="#16222e">M05 REQUERIMIENTOS</text>
  <text x="600" y="185" text-anchor="middle" font-size="9" fill="#5b6b78">ram &gt;= 8, region = EU</text>
  <rect x="518" y="198" width="164" height="36" rx="4" fill="#ffffff" stroke="#9ec7e2"/>
  <text x="600" y="215" text-anchor="middle" font-size="11" font-weight="bold" fill="#16222e">M06 ARQUITECTURAS</text>
  <text x="600" y="227" text-anchor="middle" font-size="9" fill="#5b6b78">propuesta validada</text>
  <rect x="518" y="240" width="164" height="32" rx="4" fill="#fff8e6" stroke="#e0a800"/>
  <text x="600" y="255" text-anchor="middle" font-size="11" font-weight="bold" fill="#16222e">M07 IA</text>
  <text x="600" y="266" text-anchor="middle" font-size="9" fill="#8a6d00">recomienda, no decide</text>

  <!-- BLOQUE CONTRATACION -->
  <rect x="735" y="80" width="215" height="200" rx="8" fill="#eef4f9" stroke="#1f5f8b" stroke-width="2"/>
  <text x="842" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5f8b">CONTRATACIÓN</text>
  <rect x="752" y="114" width="182" height="26" rx="4" fill="#ffffff" stroke="#9ec7e2"/>
  <text x="843" y="131" text-anchor="middle" font-size="10" font-weight="bold" fill="#16222e">M08 CARRITO e ITEMS</text>
  <rect x="752" y="145" width="182" height="26" rx="4" fill="#ffffff" stroke="#9ec7e2"/>
  <text x="843" y="162" text-anchor="middle" font-size="10" font-weight="bold" fill="#16222e">M09 PRESUPUESTOS</text>
  <rect x="752" y="176" width="182" height="26" rx="4" fill="#ffffff" stroke="#9ec7e2"/>
  <text x="843" y="193" text-anchor="middle" font-size="10" font-weight="bold" fill="#16222e">M10 PEDIDOS</text>
  <rect x="752" y="207" width="182" height="26" rx="4" fill="#ffffff" stroke="#9ec7e2"/>
  <text x="843" y="224" text-anchor="middle" font-size="10" font-weight="bold" fill="#16222e">M11 PAGOS (simulados)</text>
  <rect x="752" y="238" width="182" height="26" rx="4" fill="#ffffff" stroke="#9ec7e2"/>
  <text x="843" y="251" text-anchor="middle" font-size="10" font-weight="bold" fill="#16222e">M12 DESPLIEGUES</text>
  <text x="843" y="261" text-anchor="middle" font-size="9" fill="#5b6b78">M13 RECURSOS</text>

  <!-- Flechas entre bloques -->
  <defs>
    <marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#1f5f8b"/>
    </marker>
  </defs>
  <line x1="465" y1="180" x2="497" y2="180" stroke="#1f5f8b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="700" y1="180" x2="732" y2="180" stroke="#1f5f8b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="230" y1="180" x2="262" y2="180" stroke="#1f5f8b" stroke-width="2" marker-end="url(#a)"/>

  <!-- FLUJO PRINCIPAL -->
  <rect x="30" y="320" width="920" height="118" rx="8" fill="#f7fafc" stroke="#c9d8e3"/>
  <text x="50" y="345" font-size="13" font-weight="bold" fill="#1f5f8b">Flujo principal del sistema</text>

  <g font-size="10.5" fill="#16222e">
    <rect x="50" y="358" width="118" height="34" rx="4" fill="#ffffff" stroke="#9ec7e2"/>
    <text x="109" y="379" text-anchor="middle">Necesidad</text>
    <line x1="168" y1="375" x2="192" y2="375" stroke="#1f5f8b" stroke-width="1.6" marker-end="url(#a)"/>

    <rect x="195" y="358" width="118" height="34" rx="4" fill="#ffffff" stroke="#9ec7e2"/>
    <text x="254" y="379" text-anchor="middle">Requerimientos</text>
    <line x1="313" y1="375" x2="337" y2="375" stroke="#1f5f8b" stroke-width="1.6" marker-end="url(#a)"/>

    <rect x="340" y="358" width="118" height="34" rx="4" fill="#fff8e6" stroke="#e0a800"/>
    <text x="399" y="379" text-anchor="middle">Propuesta IA</text>
    <line x1="458" y1="375" x2="482" y2="375" stroke="#1f5f8b" stroke-width="1.6" marker-end="url(#a)"/>

    <rect x="485" y="358" width="130" height="34" rx="4" fill="#edf7f1" stroke="#1b6b43" stroke-width="1.6"/>
    <text x="550" y="374" text-anchor="middle" font-weight="bold" fill="#1b6b43">VALIDADOR</text>
    <text x="550" y="386" text-anchor="middle" font-size="8.5" fill="#1b6b43">decide Laravel</text>
    <line x1="615" y1="375" x2="639" y2="375" stroke="#1f5f8b" stroke-width="1.6" marker-end="url(#a)"/>

    <rect x="642" y="358" width="118" height="34" rx="4" fill="#ffffff" stroke="#9ec7e2"/>
    <text x="701" y="379" text-anchor="middle">Presupuesto</text>
    <line x1="760" y1="375" x2="784" y2="375" stroke="#1f5f8b" stroke-width="1.6" marker-end="url(#a)"/>

    <rect x="787" y="358" width="140" height="34" rx="4" fill="#ffffff" stroke="#9ec7e2"/>
    <text x="857" y="374" text-anchor="middle">Pedido → Pago</text>
    <text x="857" y="386" text-anchor="middle" font-size="8.5" fill="#5b6b78">→ Despliegue simulado</text>
  </g>
  <text x="50" y="418" font-size="9.5" fill="#5b6b78" font-style="italic">Toda operación relevante del flujo queda registrada en M14 AUDITORÍA.</text>

  <!-- SOPORTE -->
  <rect x="30" y="458" width="920" height="40" rx="6" fill="#ffffff" stroke="#c9d8e3"/>
  <text x="50" y="483" font-size="11" fill="#16222e"><tspan font-weight="bold">M15 SOPORTE</tspan> · transversal: se contrata como producto del catálogo y se asocia a un despliegue</text>

  <!-- Leyenda -->
  <rect x="30" y="518" width="920" height="72" rx="6" fill="#f7fafc" stroke="#c9d8e3"/>
  <text x="50" y="540" font-size="11" font-weight="bold" fill="#1f5f8b">Leyenda</text>
  <rect x="50" y="550" width="16" height="12" rx="2" fill="#ffffff" stroke="#9ec7e2"/>
  <text x="74" y="560" font-size="10" fill="#16222e">Módulo del sistema</text>
  <rect x="220" y="550" width="16" height="12" rx="2" fill="#fff8e6" stroke="#e0a800"/>
  <text x="244" y="560" font-size="10" fill="#16222e">Interviene la IA (solo recomienda)</text>
  <rect x="470" y="550" width="16" height="12" rx="2" fill="#edf7f1" stroke="#1b6b43"/>
  <text x="494" y="560" font-size="10" fill="#16222e">Punto donde decide la lógica de aplicación</text>
  <text x="50" y="578" font-size="9.5" fill="#5b6b78" font-style="italic">BORRADOR — rehacer en draw.io antes de la entrega y numerar como figura.</text>
</svg>
