<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 720" width="1020" height="720" font-family="Helvetica, Arial, sans-serif">
  <rect width="1020" height="720" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#5b6b78"/>
    </marker>
  </defs>

  <text x="510" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#16222e">Figura 2 · Modelo conceptual de datos</text>
  <text x="510" y="52" text-anchor="middle" font-size="12" fill="#5b6b78">Entidades y relaciones principales · diseño inicial, evolucionará en UT2</text>

  <!-- ===== ZONA CATALOGO ===== -->
  <rect x="20" y="72" width="300" height="300" rx="8" fill="#f4f9fc" stroke="#9ec7e2" stroke-dasharray="4 3"/>
  <text x="34" y="92" font-size="11" font-weight="bold" fill="#1f5f8b">CATÁLOGO</text>

  <rect x="40" y="104" width="120" height="48" rx="4" fill="#fff" stroke="#1f5f8b" stroke-width="1.5"/>
  <text x="100" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#16222e">PROVEEDOR</text>
  <text x="100" y="136" text-anchor="middle" font-size="8.5" fill="#5b6b78">nombre, web</text>

  <rect x="188" y="104" width="120" height="48" rx="4" fill="#fff" stroke="#1f5f8b" stroke-width="1.5"/>
  <text x="248" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#16222e">REGIÓN</text>
  <text x="248" y="131" text-anchor="middle" font-size="8.5" fill="#5b6b78">código, país</text>
  <text x="248" y="143" text-anchor="middle" font-size="8.5" fill="#5b6b78">zona UE/US/Asia</text>
  <line x1="160" y1="128" x2="185" y2="128" stroke="#5b6b78" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="172" y="122" text-anchor="middle" font-size="8" fill="#5b6b78">1:N</text>

  <rect x="40" y="172" width="120" height="48" rx="4" fill="#fff" stroke="#1f5f8b" stroke-width="1.5"/>
  <text x="100" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#16222e">TIPO_PRODUCTO</text>
  <text x="100" y="204" text-anchor="middle" font-size="8.5" fill="#5b6b78">código, nombre</text>

  <rect x="40" y="240" width="120" height="48" rx="4" fill="#fff" stroke="#1f5f8b" stroke-width="1.5"/>
  <text x="100" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#16222e">ATRIBUTO</text>
  <text x="100" y="272" text-anchor="middle" font-size="8.5" fill="#5b6b78">nombre, unidad, oblig.</text>
  <line x1="100" y1="220" x2="100" y2="237" stroke="#5b6b78" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="114" y="233" font-size="8" fill="#5b6b78">1:N</text>

  <rect x="188" y="172" width="120" height="48" rx="4" fill="#fff" stroke="#1f5f8b" stroke-width="1.5"/>
  <text x="248" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#16222e">PRODUCTO</text>
  <text x="248" y="204" text-anchor="middle" font-size="8.5" fill="#5b6b78">código, estado, unidad</text>
  <line x1="160" y1="196" x2="185" y2="196" stroke="#5b6b78" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="172" y="190" text-anchor="middle" font-size="8" fill="#5b6b78">1:N</text>

  <rect x="188" y="240" width="120" height="48" rx="4" fill="#fff" stroke="#1f5f8b" stroke-width="1.5"/>
  <text x="248" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#16222e">CONFIGURACIÓN</text>
  <text x="248" y="272" text-anchor="middle" font-size="8.5" fill="#5b6b78">valores de atributo</text>
  <line x1="248" y1="220" x2="248" y2="237" stroke="#5b6b78" stroke-width="1.4" marker-end="url(#ar)"/>

