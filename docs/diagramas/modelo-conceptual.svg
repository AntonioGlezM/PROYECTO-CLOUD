  <text x="180" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#16222e">PRECIO</text>
  <text x="180" y="340" text-anchor="middle" font-size="8.5" fill="#8a6d00">importe, periodicidad, vigencia</text>
  <line x1="248" y1="152" x2="248" y2="169" stroke="#5b6b78" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="262" y="165" font-size="8" fill="#5b6b78">N:M</text>
  <line x1="215" y1="288" x2="190" y2="305" stroke="#e0a800" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="34" y="366" font-size="8.5" fill="#8a6d00" font-style="italic">El precio depende de producto + región (+ configuración)</text>

  <!-- ===== ZONA DISEÑO ===== -->
  <rect x="340" y="72" width="300" height="300" rx="8" fill="#f4f9fc" stroke="#9ec7e2" stroke-dasharray="4 3"/>
  <text x="354" y="92" font-size="11" font-weight="bold" fill="#1f5f8b">DISEÑO</text>

  <rect x="430" y="104" width="120" height="48" rx="4" fill="#fff" stroke="#1f5f8b" stroke-width="1.5"/>
  <text x="490" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#16222e">USUARIO</text>
  <text x="490" y="136" text-anchor="middle" font-size="8.5" fill="#5b6b78">email, rol, estado</text>

  <rect x="430" y="172" width="120" height="48" rx="4" fill="#fff" stroke="#1f5f8b" stroke-width="1.5"/>
  <text x="490" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#16222e">PROYECTO</text>
  <text x="490" y="204" text-anchor="middle" font-size="8.5" fill="#5b6b78">presupuesto, usuarios</text>
  <line x1="490" y1="152" x2="490" y2="169" stroke="#5b6b78" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="504" y="165" font-size="8" fill="#5b6b78">1:N</text>

  <rect x="352" y="240" width="130" height="48" rx="4" fill="#fff" stroke="#1f5f8b" stroke-width="1.5"/>
  <text x="417" y="258" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#16222e">REQUERIMIENTO</text>
  <text x="417" y="272" text-anchor="middle" font-size="8.5" fill="#5b6b78">atributo, operador, valor</text>
  <line x1="460" y1="220" x2="430" y2="237" stroke="#5b6b78" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="498" y="240" width="130" height="48" rx="4" fill="#fff" stroke="#1f5f8b" stroke-width="1.5"/>
  <text x="563" y="258" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#16222e">ARQUITECTURA</text>
  <text x="563" y="272" text-anchor="middle" font-size="8.5" fill="#5b6b78">versión, estado, origen</text>
  <line x1="520" y1="220" x2="550" y2="237" stroke="#5b6b78" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="352" y="308" width="130" height="46" rx="4" fill="#fff8e6" stroke="#e0a800" stroke-width="1.5"/>
  <text x="417" y="326" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#16222e">RECOMENDACIÓN_IA</text>
  <text x="417" y="340" text-anchor="middle" font-size="8.5" fill="#8a6d00">entrada, propuesta, decisión</text>

  <rect x="498" y="308" width="130" height="46" rx="4" fill="#fff" stroke="#1f5f8b" stroke-width="1.5"/>
  <text x="563" y="326" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#16222e">ITEM</text>
  <text x="563" y="340" text-anchor="middle" font-size="8.5" fill="#5b6b78">cantidad, precio aplicado</text>
  <line x1="563" y1="288" x2="563" y2="305" stroke="#5b6b78" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="308" y1="264" x2="495" y2="330" stroke="#9ec7e2" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#ar)"/>

  <!-- ===== ZONA CONTRATACION ===== -->
  <rect x="660" y="72" width="340" height="500" rx="8" fill="#f4f9fc" stroke="#9ec7e2" stroke-dasharray="4 3"/>
  <text x="674" y="92" font-size="11" font-weight="bold" fill="#1f5f8b">CONTRATACIÓN</text>

  <rect x="760" y="104" width="140" height="44" rx="4" fill="#fff" stroke="#1f5f8b" stroke-width="1.5"/>
  <text x="830" y="121" text-anchor="middle" font-size="11" font-weight="bold" fill="#16222e">CARRITO</text>
  <text x="830" y="134" text-anchor="middle" font-size="8.5" fill="#5b6b78">estado, fecha</text>
  <line x1="628" y1="330" x2="757" y2="138" stroke="#9ec7e2" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#ar)"/>

  <rect x="740" y="172" width="180" height="52" rx="4" fill="#fff" stroke="#1f5f8b" stroke-width="1.5"/>
  <text x="830" y="189" text-anchor="middle" font-size="11" font-weight="bold" fill="#16222e">PRESUPUESTO</text>
  <text x="830" y="202" text-anchor="middle" font-size="8.5" fill="#5b6b78">código, caducidad, totales</text>
  <text x="830" y="214" text-anchor="middle" font-size="8.5" fill="#5b6b78">mensual y único · moneda</text>
  <line x1="830" y1="148" x2="830" y2="169" stroke="#5b6b78" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="676" y="244" width="140" height="44" rx="4" fill="#edf7f1" stroke="#1b6b43" stroke-width="1.5"/>
  <text x="746" y="261" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b6b43">LÍNEA_PRESUPUESTO</text>
  <text x="746" y="274" text-anchor="middle" font-size="8" fill="#1b6b43">copia histórica congelada</text>
  <line x1="800" y1="224" x2="770" y2="241" stroke="#5b6b78" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="844" y="244" width="140" height="44" rx="4" fill="#fff" stroke="#1f5f8b" stroke-width="1.5"/>
  <text x="914" y="261" text-anchor="middle" font-size="11" font-weight="bold" fill="#16222e">PEDIDO</text>
  <text x="914" y="274" text-anchor="middle" font-size="8.5" fill="#5b6b78">código, estado, totales</text>
  <line x1="880" y1="224" x2="905" y2="241" stroke="#5b6b78" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="900" y="236" font-size="8" fill="#5b6b78">1:1</text>

  <rect x="676" y="312" width="140" height="42" rx="4" fill="#fff" stroke="#1f5f8b" stroke-width="1.5"/>
  <text x="746" y="329" text-anchor="middle" font-size="11" font-weight="bold" fill="#16222e">PAGO</text>
  <text x="746" y="342" text-anchor="middle" font-size="8.5" fill="#5b6b78">importe, método simulado</text>
  <line x1="860" y1="288" x2="790" y2="309" stroke="#5b6b78" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="820" y="300" font-size="8" fill="#5b6b78">1:1</text>

  <rect x="844" y="312" width="140" height="42" rx="4" fill="#fff" stroke="#1f5f8b" stroke-width="1.5"/>
  <text x="914" y="329" text-anchor="middle" font-size="11" font-weight="bold" fill="#16222e">DESPLIEGUE</text>
  <text x="914" y="342" text-anchor="middle" font-size="8.5" fill="#5b6b78">estado, fechas</text>
  <line x1="914" y1="288" x2="914" y2="309" stroke="#5b6b78" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="928" y="304" font-size="8" fill="#5b6b78">1:N</text>

  <rect x="844" y="378" width="140" height="44" rx="4" fill="#fff" stroke="#1f5f8b" stroke-width="1.5"/>
  <text x="914" y="395" text-anchor="middle" font-size="11" font-weight="bold" fill="#16222e">RECURSO</text>
  <text x="914" y="408" text-anchor="middle" font-size="8.5" fill="#5b6b78">id simulado, región, estado</text>
  <line x1="914" y1="354" x2="914" y2="375" stroke="#5b6b78" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="928" y="370" font-size="8" fill="#5b6b78">1:N</text>

  <rect x="676" y="446" width="308" height="44" rx="4" fill="#f7fafc" stroke="#5b6b78" stroke-width="1.5"/>
  <text x="830" y="463" text-anchor="middle" font-size="11" font-weight="bold" fill="#16222e">AUDITORÍA</text>
  <text x="830" y="476" text-anchor="middle" font-size="8.5" fill="#5b6b78">usuario · acción · entidad · fecha · antes / después — inmutable</text>

  <text x="674" y="516" font-size="8.5" fill="#5b6b78" font-style="italic">Recibe eventos de todos los módulos.</text>
  <text x="674" y="528" font-size="8.5" fill="#5b6b78" font-style="italic">Las entradas no se modifican ni se borran (RN-11).</text>
  <text x="674" y="544" font-size="8.5" fill="#1b6b43" font-style="italic">LÍNEA_PRESUPUESTO copia los datos;</text>
  <text x="674" y="556" font-size="8.5" fill="#1b6b43" font-style="italic">no referencia al catálogo vivo (decisión M-04).</text>

  <!-- Leyenda -->
  <rect x="20" y="590" width="980" height="110" rx="6" fill="#f7fafc" stroke="#c9d8e3"/>
  <text x="40" y="612" font-size="11" font-weight="bold" fill="#1f5f8b">Leyenda y decisiones reflejadas</text>
  <rect x="40" y="622" width="16" height="12" rx="2" fill="#fff" stroke="#1f5f8b"/>
  <text x="64" y="632" font-size="10" fill="#16222e">Entidad</text>
  <rect x="150" y="622" width="16" height="12" rx="2" fill="#fff8e6" stroke="#e0a800"/>
  <text x="174" y="632" font-size="10" fill="#16222e">Precio / IA — puntos sensibles</text>
  <rect x="400" y="622" width="16" height="12" rx="2" fill="#edf7f1" stroke="#1b6b43"/>
  <text x="424" y="632" font-size="10" fill="#16222e">Copia histórica congelada</text>
  <line x1="650" y1="628" x2="676" y2="628" stroke="#9ec7e2" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="684" y="632" font-size="10" fill="#16222e">Relación a decidir en UT2</text>
  <text x="40" y="656" font-size="9.5" fill="#5b6b78">· El precio no cuelga del producto: cuelga de producto + región, y la configuración puede modificarlo.</text>
  <text x="40" y="672" font-size="9.5" fill="#5b6b78">· DISPONIBILIDAD resuelve el N:M producto–región y lleva el precio asociado (no dibujada como caja para no saturar).</text>
  <text x="40" y="690" font-size="9.5" fill="#5b6b78" font-style="italic">BORRADOR — rehacer en draw.io antes de la entrega y numerar como figura.</text>
</svg>
