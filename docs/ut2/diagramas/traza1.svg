<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5f8b"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3261e"/></marker>
  </defs>
  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#16222e">Figura 2 · Traza 1 — consulta con filtros (GET)</text>
  <text x="500" y="47" text-anchor="middle" font-size="11" fill="#5b6b78">GET /catalogo?tipo=1&amp;region=1 — con la bifurcación de filtro válido e inválido</text>

  <rect x="330" y="72" width="340" height="46" rx="5" fill="#ffffff" stroke="#16222e" stroke-width="2"/>
  <text x="500" y="90" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#16222e">1 · El navegador envía GET /catalogo?tipo=1&amp;region=1</text>
  <text x="500" y="108" text-anchor="middle" font-size="8.5" fill="#5b6b78">los filtros viajan en la URL, no en el cuerpo</text>

  <line x1="500" y1="118" x2="500" y2="140" stroke="#1f5f8b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="330" y="142" width="340" height="44" rx="5" fill="#eef4f9" stroke="#1f5f8b" stroke-width="2"/>
  <text x="500" y="160" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1f5f8b">2 · Route</text>
  <text x="500" y="177" text-anchor="middle" font-size="8.5" fill="#5b6b78">routes/web.php — catalogo.index va a CatalogoController@index</text>

  <line x1="500" y1="186" x2="500" y2="208" stroke="#1f5f8b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="330" y="210" width="340" height="44" rx="5" fill="#eef4f9" stroke="#1f5f8b" stroke-width="2"/>
  <text x="500" y="228" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1f5f8b">3 · Controller</text>
  <text x="500" y="245" text-anchor="middle" font-size="8.5" fill="#5b6b78">CatalogoController::index recibe la Request</text>

  <line x1="500" y1="254" x2="500" y2="276" stroke="#1f5f8b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="310" y="278" width="380" height="48" rx="5" fill="#fff6d8" stroke="#d79b00" stroke-width="2"/>
  <text x="500" y="296" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d00">4 · Validación de los filtros</text>
  <text x="500" y="313" text-anchor="middle" font-size="8.5" fill="#6b5500">tipo y region deben existir en su tabla (regla exists)</text>

  <!-- rama valida -->
  <path d="M 380 326 L 230 326 L 230 358" fill="none" stroke="#1f5f8b" stroke-width="2" marker-end="url(#a)"/>
  <text x="236" y="344" font-size="9" font-weight="bold" fill="#1f5f8b">válido</text>
  <rect x="40" y="360" width="380" height="96" rx="5" fill="#eef4f9" stroke="#1f5f8b" stroke-width="2"/>
  <text x="230" y="379" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1f5f8b">5a · Consulta a la base de datos</text>
  <text x="230" y="396" text-anchor="middle" font-size="8.3" fill="#5b6b78">Producto con los scopes activos, deTipo y disponibleEnRegion</text>
  <text x="230" y="411" text-anchor="middle" font-size="8.3" fill="#5b6b78">with(tipo, proveedor) evita el problema N+1</text>
  <text x="230" y="426" text-anchor="middle" font-size="8.3" fill="#5b6b78">paginate(10)-&gt;withQueryString() conserva los filtros</text>
  <text x="230" y="444" text-anchor="middle" font-size="8.3" fill="#1b6b43">devuelve una colección paginada de productos</text>

  <!-- rama invalida -->
  <path d="M 620 326 L 770 326 L 770 358" fill="none" stroke="#b3261e" stroke-width="2" marker-end="url(#ar)"/>
  <text x="700" y="344" font-size="9" font-weight="bold" fill="#b3261e">inválido</text>
  <rect x="580" y="360" width="380" height="96" rx="5" fill="#fdecea" stroke="#b3261e" stroke-width="2"/>
  <text x="770" y="379" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b3261e">5b · No se consulta nada</text>
  <text x="770" y="396" text-anchor="middle" font-size="8.3" fill="#7a1d17">Laravel interrumpe antes de llegar a la consulta</text>
  <text x="770" y="411" text-anchor="middle" font-size="8.3" fill="#7a1d17">redirige al listado con los errores en sesión</text>
  <text x="770" y="426" text-anchor="middle" font-size="8.3" fill="#7a1d17">el componente alertas los muestra arriba</text>
  <text x="770" y="444" text-anchor="middle" font-size="8.3" fill="#7a1d17">la base de datos no recibe ninguna consulta</text>

  <line x1="230" y1="456" x2="230" y2="478" stroke="#1f5f8b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="40" y="480" width="380" height="32" rx="5" fill="#ffffff" stroke="#16222e" stroke-width="2"/>
  <text x="230" y="500" text-anchor="middle" font-size="9" fill="#16222e">6 · catalogo/index.blade.php pinta la tabla y los enlaces de página</text>
</svg>
