<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 660" width="1020" height="660" font-family="Helvetica, Arial, sans-serif">
  <rect width="1020" height="660" fill="#ffffff"/>
  <text x="510" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#16222e">Figura 4 · Modelo entidad–relación</text>
  <text x="510" y="47" text-anchor="middle" font-size="11" fill="#5b6b78">Entidades y cardinalidades, sin claves ni tipos</text>

  <g font-size="10.5" font-weight="bold" fill="#16222e" text-anchor="middle">
    <rect x="40"  y="80"  width="150" height="42" rx="5" fill="#eef4f9" stroke="#1f5f8b" stroke-width="2"/><text x="115" y="106">PROVEEDOR</text>
    <rect x="40"  y="180" width="150" height="42" rx="5" fill="#eef4f9" stroke="#1f5f8b" stroke-width="2"/><text x="115" y="206">REGIÓN</text>
    <rect x="300" y="80"  width="150" height="42" rx="5" fill="#eef4f9" stroke="#1f5f8b" stroke-width="2"/><text x="375" y="106">TIPO PRODUCTO</text>
    <rect x="300" y="180" width="150" height="42" rx="5" fill="#eef4f9" stroke="#1f5f8b" stroke-width="2"/><text x="375" y="206">PRODUCTO</text>
    <rect x="300" y="282" width="150" height="48" rx="5" fill="#fff6d8" stroke="#d79b00" stroke-width="2"/>
    <text x="375" y="302" fill="#8a6d00">DISPONIBILIDAD</text><text x="375" y="318" font-size="8" font-weight="normal" fill="#6b5500">disponible · tarifa</text>
    <rect x="620" y="80"  width="160" height="42" rx="5" fill="#eef4f9" stroke="#1f5f8b" stroke-width="2"/><text x="700" y="106">PROYECTO</text>
    <rect x="860" y="80"  width="140" height="42" rx="5" fill="#eef4f9" stroke="#1f5f8b" stroke-width="2"/><text x="930" y="106">REQUERIMIENTO</text>
    <rect x="860" y="180" width="140" height="42" rx="5" fill="#eef4f9" stroke="#1f5f8b" stroke-width="2"/><text x="930" y="206">FICHERO</text>
    <rect x="620" y="180" width="160" height="42" rx="5" fill="#eef4f9" stroke="#1f5f8b" stroke-width="2"/><text x="700" y="206">ARQUITECTURA</text>
    <rect x="620" y="282" width="160" height="42" rx="5" fill="#eef4f9" stroke="#1f5f8b" stroke-width="2"/><text x="700" y="308" font-size="9.5">ELEMENTO ARQUIT.</text>
    <rect x="620" y="382" width="160" height="42" rx="5" fill="#eef4f9" stroke="#1f5f8b" stroke-width="2"/><text x="700" y="408">LÍNEA CARRITO</text>
    <rect x="620" y="482" width="160" height="42" rx="5" fill="#eef4f9" stroke="#1f5f8b" stroke-width="2"/><text x="700" y="508">PRESUPUESTO</text>
    <rect x="860" y="482" width="140" height="48" rx="5" fill="#edf7f1" stroke="#1b6b43" stroke-width="2"/>
    <text x="930" y="502" fill="#1b6b43" font-size="9.5">LÍNEA PRESUP.</text><text x="930" y="518" font-size="7.5" font-weight="normal" fill="#1b6b43">copia histórica</text>
    <rect x="40"  y="482" width="150" height="42" rx="5" fill="#eef4f9" stroke="#1f5f8b" stroke-width="2"/><text x="115" y="508">AUDITORÍA</text>
  </g>

  <g stroke="#1f5f8b" stroke-width="1.6" fill="none">
    <line x1="115" y1="122" x2="115" y2="180"/>
    <line x1="190" y1="101" x2="300" y2="195"/>
