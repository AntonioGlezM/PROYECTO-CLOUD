    <line x1="780" y1="101" x2="860" y2="101"/>
    <line x1="780" y1="110" x2="860" y2="195"/>
    <line x1="700" y1="222" x2="700" y2="282"/>
    <line x1="750" y1="122" x2="760" y2="382"/>
    <line x1="700" y1="122" x2="660" y2="482"/>
    <line x1="780" y1="503" x2="860" y2="503"/>
    <line x1="450" y1="306" x2="620" y2="306"/>
    <line x1="450" y1="306" x2="620" y2="400"/>
  </g>

  <g font-size="8.5" fill="#5b6b78">
    <text x="122" y="152">1:N</text>
    <text x="238" y="140">1:N</text>
    <text x="382" y="152">1:N</text>
    <text x="382" y="256">1:N</text>
    <text x="238" y="262">1:N</text>
    <text x="707" y="152">1:N</text>
    <text x="810" y="95">1:N</text>
    <text x="800" y="160">1:N</text>
    <text x="707" y="256">1:N</text>
    <text x="766" y="340">1:N</text>
    <text x="640" y="340">1:N</text>
    <text x="800" y="498">1:N</text>
    <text x="520" y="300">N:1</text>
    <text x="520" y="372">N:1</text>
  </g>

  <rect x="40" y="560" width="960" height="78" rx="5" fill="#f7fafc" stroke="#d4dde4"/>
  <text x="56" y="580" font-size="10" font-weight="bold" fill="#1f5f8b">Dos decisiones que explican este modelo</text>
  <text x="56" y="598" font-size="8.6" fill="#16222e">ADR-001 · PRODUCTO y REGIÓN no se relacionan directamente: entre medias hay DISPONIBILIDAD, que guarda si el producto se ofrece ahí y a qué precio.</text>
  <text x="56" y="613" font-size="8.6" fill="#16222e">ADR-003 · LÍNEA PRESUPUESTO no se relaciona con PRODUCTO: copia sus datos. Por eso el presupuesto no cambia cuando cambia el catálogo.</text>
  <text x="56" y="630" font-size="8.6" fill="#5b6b78">AUDITORÍA no tiene relaciones: guarda entidad y entidad_id como texto y número, para poder registrar operaciones sobre cualquier tabla.</text>
</svg>
